<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("linknest-theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Sign up — LinkNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="brand">Link<span class="brand-mark">Nest</span></p>
      <p class="subtitle">Create your account to start shortening and sharing.</p>

      <div id="auth-banner" class="banner"></div>
      <div id="dev-hint" class="banner banner-success" style="font-size:12.5px;"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="displayName">Display name</label>
          <input id="displayName" name="displayName" type="text" placeholder="Jamie Rivera" required />
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="jamie" data-validate="username" required />
          <p class="field-hint">This becomes your public page: /bio/&lt;username&gt;</p>
          <p class="field-error"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" data-validate="email" required />
          <p class="field-error"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 8 characters" data-validate="password" required />
          <p class="field-hint">8+ characters, one uppercase letter, one number.</p>
          <p class="field-error"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-links">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
